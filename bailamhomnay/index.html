<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <body>

        <div class="task-system__header">
            <h2 class="task-system__title">Hệ Thống Quản Lý Công Việc</h2>
        </div>
        <div class="content">
            <div class="container">
                <div class="task-system__box ">
                    <h4 class=" task-form__title">Thêm / Cập Nhật Công Việc</h4>

                    <form class="task-form">
                        <div class="row 3">
                            <div class="col 6">
                                <label for="tencongviec" class="form-label ">Tên công việc:</label>
                                <input type="text" class="form-control" id="tencongviec">
                                <div class="waring Name"> </div>

                            </div>
                            <div class="col 6">
                                <label for="deadline" class="form-label">Hạn chót:</label>
                                <input type="date" class="form-control " id="deadline">
                                <div class="waring Deadline"> </div>


                            </div>
                        </div>

                        <div class="row ">
                            <div class="col 6">
                                <label for="phutrach" class="form-label ">Người phụ trách:</label>
                                <input type="text" class="form-control " id="phutrach">

                                <div class="waring Leader"> </div>


                            </div>
                            <div class="col-md-6">
                                <label for="trangthai" class="form-label ">Trạng thái:</label>
                                <select class="form-control " id="trangthai">
                                    <option selected disabled>-- Chọn trạng thái --</option>
                                    <option>Đang tiến hành</option>
                                    <option>Hoàn thành</option>
                                    <option>Chưa bắt đầu</option>
                                </select>
                                <div class="waring Status"> </div>

                            </div>
                        </div>

                        <div>
                            <button id="submit" class="btn btn-success " type="submit">Thêm công việc</button>
                        </div>
                    </form>

                    <input id="searchTask" type="text" class="form-control"
                        placeholder="Tìm kiếm theo tên công việc...">

                    <table>
                        <thead>
                            <tr>
                                <th class="task-table__header">Công việc</th>
                                <th class="task-table__header">Hạn chót</th>
                                <th class="task-table__header">Phụ trách</th>
                                <th class="task-table__header">Trạng thái</th>
                                <th class="task-table__header">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>

                </div>
            </div>

        </div>
        <div>

        </div>
    </body>

    <script src="main.js"></script>
</body>

</html>
